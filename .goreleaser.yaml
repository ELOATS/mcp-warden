# GoReleaser v2 config. Triggered by .github/workflows/release.yml on v* tags.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: mcp-warden

builds:
  - id: mcp-warden
    main: ./cmd/mcp-warden
    binary: mcp-warden
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - README.zh-CN.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto

# Homebrew: `brew install --cask eloats/tap/mcp-warden`.
# Published to github.com/ELOATS/homebrew-tap. Needs a repository secret
# HOMEBREW_TAP_GITHUB_TOKEN with write access to that repo; without it the
# cask is still generated (see dist/) but not uploaded, and the release
# itself is unaffected.
homebrew_casks:
  - name: mcp-warden
    binaries:
      - mcp-warden
    repository:
      owner: ELOATS
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    directory: Casks
    homepage: https://github.com/ELOATS/mcp-warden
    description: Find risky MCP servers before they find you
    license: Apache-2.0
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "mcp-warden {{ .Tag }}"
    # The macOS binaries are not notarized and Homebrew quarantines cask
    # downloads, so Gatekeeper would block the first run without this.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/mcp-warden"]
          end
