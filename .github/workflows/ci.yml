name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest Go on every platform we ship. Old toolchains produce macOS
          # binaries without LC_UUID, which recent macOS refuses to load.
          - { os: ubuntu-latest, go: stable }
          - { os: macos-latest, go: stable }
          # Minimum version declared in go.mod.
          - { os: ubuntu-latest, go: "1.22" }
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/mcp-warden

  # Validates .goreleaser.yaml and builds a snapshot (nothing is published),
  # so release-config problems show up before a tag is pushed.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Show generated Homebrew cask
        run: find dist -name '*.rb' -print -exec cat {} \;
